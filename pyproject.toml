[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminalcreature"
dynamic = ["version"]
description = "a terminal pet for your Claude Code statusline that evolves as your memory grows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Smejkal Design", email = "eric@smejkal.design" }]
keywords = ["claude-code", "statusline", "pet", "tamagotchi", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/smejkaldesign/terminalcreature"
Changelog = "https://github.com/smejkaldesign/terminalcreature/blob/main/CHANGELOG.md"
Issues = "https://github.com/smejkaldesign/terminalcreature/issues"

[project.scripts]
terminalcreature = "terminalcreature.cli:main"

[tool.hatch.version]
path = "terminalcreature/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["terminalcreature"]

# the sdist carries everything a from-source install needs: the wiring
# script and the slash commands are not importable code but they are the product
[tool.hatch.build.targets.sdist]
include = [
    "terminalcreature",
    "commands",
    "install.sh",
    "scripts",
    "tests",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]
