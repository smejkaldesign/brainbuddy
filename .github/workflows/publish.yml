# tag vX.Y.Z -> test, build, publish to PyPI via trusted publishing (no stored token).
# the pypi environment name is part of the trusted-publisher registration; renaming
# either side silently breaks the handshake.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # the same floor-to-ceiling matrix as ci, because ci does not run on tags and
  # a release is the one build that must not skip the 3.9 floor
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/test_brainbuddy.py
      - run: bash scripts/leak-guard.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify tag matches package and plugin versions
        run: |
          PKG=$(python3 -c "import brainbuddy; print(brainbuddy.__version__)")
          PLUGIN=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag v$TAG does not match brainbuddy.__version__ $PKG" >&2
            exit 1
          fi
          if [ "$PLUGIN" != "$TAG" ]; then
            echo "tag v$TAG does not match plugin.json version $PLUGIN, plugin users would never see this update" >&2
            exit 1
          fi
      - run: python3 -m pip install build
      - run: python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # pinned to a commit: this job holds id-token write, and a mutable branch
      # ref would let that action change under us
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
